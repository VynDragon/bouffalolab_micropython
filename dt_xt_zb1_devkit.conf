# Hardware features.
CONFIG_PINCTRL=y
CONFIG_GPIO=y

# Disable networking.
CONFIG_NETWORKING=n
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETCHAR=y

# MicroPython config.
CONFIG_MICROPY_HEAP_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_WATCHDOG=n
CONFIG_MICROPY_DYNAMIC_PINCTRL=y
CONFIG_PINCTRL_DYNAMIC=y
CONFIG_MICROPY_DYNAMIC_PINCTRL_HEADER="dt-bindings/pinctrl/bl702x-pinctrl.h"
CONFIG_MICROPY_DYNAMIC_PINCTRL_REGEX="GPIO[A-Za-z0-9_]+[ 	]"
CONFIG_MICROPY_DYNAMIC_PINCTRL_GENERATE_PINMUX=y
CONFIG_MICROPY_DYNAMIC_PINCTRL_HEADER_BUILDER="dynamic_pinctrl/bflb.h"
CONFIG_CONSOLE_GETCHAR_BUFSIZE=256

#HW
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_SPI=y

# File System Configuration
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_MICROPY_VFS_FAT=y
CONFIG_MICROPY_VFS_LFS1=n
CONFIG_MICROPY_VFS_LFS2=n
# Default heap for littlefs is too small
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=8192
